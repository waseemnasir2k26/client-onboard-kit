    - Pay the deposit invoice so the 14 September start date holds.
    - Fill in the intake questionnaire - it takes about 20 minutes.
  kickoff_call:
    date: 2026-09-15
    time: "10:00"
    duration_minutes: 45
    link: https://meet.perihelion-studio.example/kickoff
